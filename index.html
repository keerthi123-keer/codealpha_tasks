<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Image Gallery</h1>
  <div class="gallery">
    <img src="img1.jpg.jpeg" alt="Image 1">
    <img src="img2.jpg.jpeg" alt="Image 2">
    <img src="img3.jpg.jpeg" alt="Image 3">
    <img src="img4.jpg.jpeg" alt="Image 4">
    <img src="img5.jpg.jpeg" alt="Image 5">
    <img src="img6.jpg.jpeg" alt="Image 6">
    <img src="img7.jpg.jpeg" alt="Image 7">
    <img src="img8.jpg.jpeg" alt="Image 8">
  </div>

  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img">
  </div>

  <script src="script.js"></script>
</body>
</html>
